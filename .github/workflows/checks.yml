# Checks every change to dev and main: the C files' format, a Debug build with the static analyzer, the examples' tests under the sanitizers, on SDL's offscreen driver and on Wayland, a Release build, and the Lua annotations.
# Windows builds Debug and Release with LLVM-MinGW, and runs the examples' tests, without the analyzer and the sanitizers, which MinGW does not have.
# The examples are the tests: each one's test runs its preset, so they check the core and the standard plugins together.
name: Checks

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# a new push to a branch or a pull request cancels its older run, whose result no longer counts
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    env:
      CLANG_FORMAT: clang-format-18
    steps:
      - uses: actions/checkout@v4

      # the C files must be as clang-format 18, Ubuntu 24.04's, writes them; agents format them with check.sh
      - name: Install clang-format
        run: sudo apt-get install -y clang-format-18

      - name: Check the C files' format
        run: .github/scripts/format.sh

  debug-linux:
    name: Debug (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install the build tools
        run: .github/scripts/install-linux.sh

      # shuild builds a dependency only when its library is missing, so the built libraries are kept until a submodule or the build changes;
      # OpenECS's own files are compiled every time, so the analyzer sees all of them
      - name: Name the dependencies' versions
        id: dependencies
        run: echo "key=$( (git submodule status --recursive; sha256sum shuild.c dependencies/other/*/*) | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the built dependencies
        uses: actions/cache@v4
        with:
          path: |
            .shu/Debug/dependencies
          key: debug-linux-${{ steps.dependencies.outputs.key }}

      - name: Detect the compilers with shuild
        run: .github/scripts/compilers.sh

      - name: Build with the static analyzer
        run: .github/scripts/build.sh D

      - name: Run the examples' tests with the sanitizers
        run: .github/scripts/test.sh

      # on Wayland, popups and pop-out windows are windows of their own, which the offscreen driver does not have
      - name: Run the examples' tests on Wayland
        run: .github/scripts/test-wayland.sh

      - name: Write and compile the definition files
        run: .github/scripts/definitions.sh build/Debug/bin/OpenECS

      - name: Keep the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-linux-logs
          path: build/*.log

  release-linux:
    name: Release (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install the build tools
        run: .github/scripts/install-linux.sh

      - name: Name the dependencies' versions
        id: dependencies
        run: echo "key=$( (git submodule status --recursive; sha256sum shuild.c dependencies/other/*/*) | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the built dependencies
        uses: actions/cache@v4
        with:
          path: |
            .shu/Release/dependencies
          key: release-linux-${{ steps.dependencies.outputs.key }}

      # code that only Release builds compile, or link, breaks here instead of at a release
      - name: Build
        run: .github/scripts/build.sh R

  windows:
    name: Windows
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install the build tools
        shell: pwsh
        run: .github/scripts/install-windows.ps1

      # SDL's DLLs and import libraries are installed with the other dependencies, and the build copies the DLLs beside the executable
      - name: Name the dependencies' versions
        id: dependencies
        run: echo "key=$( (git submodule status --recursive; sha256sum shuild.c dependencies/other/*/*) | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the built dependencies
        uses: actions/cache@v4
        with:
          path: |
            .shu/Debug/dependencies
            .shu/Release/dependencies
          key: windows-${{ steps.dependencies.outputs.key }}

      - name: Detect the compilers with shuild
        run: .github/scripts/compilers.sh

      - name: Build Debug with LLVM-MinGW
        run: .github/scripts/build.sh D

      - name: Run the examples' tests
        run: .github/scripts/test.sh

      - name: Write and compile the definition files
        run: .github/scripts/definitions.sh build/Debug/bin/OpenECS.exe

      - name: Build Release with LLVM-MinGW
        run: .github/scripts/build.sh R

      - name: Keep the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-logs
          path: build/*.log

  lua:
    name: Lua (LuaLS)
    runs-on: ubuntu-24.04
    env:
      LUALS_VERSION: 3.15.0
    steps:
      - uses: actions/checkout@v4

      - name: Install the Lua language server
        run: |
          mkdir -p "$RUNNER_TEMP/luals"
          curl -sSL "https://github.com/LuaLS/lua-language-server/releases/download/$LUALS_VERSION/lua-language-server-$LUALS_VERSION-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP/luals"

      # ecs.lua describes the ecs module; the check finds Lua code that misuses it, and mistakes in ecs.lua itself
      - name: Check the Lua files
        run: |
          "$RUNNER_TEMP/luals/bin/lua-language-server" --check="$GITHUB_WORKSPACE" --checklevel=Warning --logpath="$RUNNER_TEMP/luals-log" | tee luals.log
          grep -q "no problems found" luals.log
